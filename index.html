<!DOCTYPE html>
<html lang="en">
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Expense Tracker</h1>

    <div class="balance">
        <h2>Balance: ₹<span id="balance">0</span></h2>
        <p>Income: ₹<span id="income">0</span> | Expense: ₹<span id="expense">0</span></p>
    </div>

    <form id="form">
    <input type="text" id="text" placeholder="Description" required>

    <input type="number" id="amount" placeholder="Amount (+ income, - expense)" required>

    <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>
    </select>

    <button>Add Transaction</button>
</form>

<canvas id="myChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <ul id="list"></ul>

</div>

<script src="js/app.js"></script>
</body>
</html>
