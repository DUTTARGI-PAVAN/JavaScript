<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <meta name="description" content="Login to Expense Tracker">
</head>
<body>
    <main class="wrap">
        <section class="panel auth-card">
            <h2>Login</h2>

            <label class="visually-hidden" for="email">Email</label>
            <input class="form-control" type="email" id="email" placeholder="Email" required>

            <label class="visually-hidden" for="password">Password</label>
            <input class="form-control" type="password" id="password" placeholder="Password" required>

            <div class="row gap">
                <button onclick="login()" class="primary btn btn-primary">Login</button>
                <button onclick="signup()" class="secondary btn btn-outline-secondary">Signup</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/auth.js"></script>
</body>
</html>
