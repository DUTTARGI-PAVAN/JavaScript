<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <meta name="description" content="Simple expense tracker with monthly report and chart">
</head>
<body>

    <header class="site-header">
        <div class="wrap header-row">
            <h1 class="logo">Expense Tracker</h1>
            <div class="header-actions">
                <button id="toggleMode" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <section class="panel">
            <div class="balance card">
                <h2 class="card-title">Balance</h2>
                <div class="amount">₹<span id="balance">0</span></div>
                <p class="sub">Income: ₹<span id="income">0</span> | Expense: ₹<span id="expense">0</span></p>
            </div>

            <form id="form" class="txn-form card">
                <input class="form-control" type="text" id="text" placeholder="Description" required>
                <div class="row">
                    <input class="form-control" type="number" id="amount" placeholder="Amount (+ income, - expense)" required>
                    <select class="form-select" id="category">
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button class="primary btn btn-primary">Add Transaction</button>
            </form>

            <h3>Monthly Report</h3>
            <p id="monthlyReport" class="card muted"></p>

            <div class="chart-wrap card">
                <canvas id="myChart" aria-label="Income vs Expense chart"></canvas>
            </div>

            <ul id="list" class="txns"></ul>

            <div class="actions">
                <button onclick="downloadPDF()" class="secondary btn btn-outline-secondary">Download PDF</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
